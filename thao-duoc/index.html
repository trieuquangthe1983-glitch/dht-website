<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHT Thảo Dược – Kho bài thuốc &amp; dược liệu</title>
<meta name="description" content="Tra cứu nhanh bài thuốc thảo dược theo bệnh, nhận biết dược liệu, bài thuốc bồi bổ, cảnh báo an toàn theo thể trạng. Hoạt động offline, cập nhật định kỳ.">
<meta name="theme-color" content="#2f6b3c">
<link rel="manifest" href="manifest.webmanifest">

  <form class="search" id="searchForm" role="search" autocomplete="off">

<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
